<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INFINIGHTCapture</title>
    <link rel="icon" type="image/png" href="/brand/infinightcapture_icon.png" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #02080f;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-content: center;
        gap: 14px;
        color: #e9fcff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .boot-logo {
        width: min(360px, 76vw);
        height: auto;
      }

      .boot-fallback span {
        color: #8fb7c7;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <img
          class="boot-logo"
          src="/brand/infinightcapture_horizontal_logo.png"
          srcset="/brand/infinightcapture_horizontal_logo.png 1x, /brand/infinightcapture_horizontal_logo_2x.png 2x"
          alt="INFINIGHTCapture"
        />
        <span>Preparing renderer</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
