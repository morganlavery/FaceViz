<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceViz</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #050807;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-content: center;
        gap: 10px;
        color: #dffbf3;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .boot-fallback strong {
        color: #8bffd0;
      }

      .boot-fallback span {
        color: #9db4ad;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <strong>FaceViz is loading</strong>
        <span>Preparing the renderer</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
