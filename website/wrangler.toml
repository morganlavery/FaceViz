name = "infinightcapture-site"
compatibility_date = "2026-06-14"
pages_build_output_dir = "."

[vars]
SITE_URL = "https://infinightcapture.com"
STRIPE_AUTOMATIC_TAX = "false"
PAID_MAC_OBJECT_KEY = "paid/INFINIGHTCapture-Paid-0.1.0-mac-arm64.dmg"
PAID_WINDOWS_OBJECT_KEY = "paid/INFINIGHTCapture-Paid-Setup-0.1.0-win-x64.exe"

[[r2_buckets]]
binding = "PAID_RELEASES"
bucket_name = "infinightcapture-releases"
